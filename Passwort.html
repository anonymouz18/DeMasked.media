<!DOCTYPE html>
<html lang="de">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Passworteingabe</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="login-box">
        <h2>Login</h2>

        <label for="password">Passwort</label>

        <div class="password-wrapper">
            <input type="password" id="password" name="password" placeholder="Passwort eingeben" required minlength="4">
            <button type="button" id="toggleBtn">Anzeigen</button>
        </div>

        <p class="hint" id="status">Das Passwort ist verborgen.</p>
    </div>

    <script src="script.js"></script>
</body>

</html>
