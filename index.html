<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kanban Board</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Roboto:300,400,500,700&display=swap">
</head>

<body>
    <div class="head">
        <img href="file.jpg" src="file.jpg" alt="Logo" class="logo">
        <h1>Kanban Board</h1>
        <a class="link" href="https://www.youtube.com/@gabriele-von-bülow-gym/featured" target="_blank">YouTube</a>
        <a class="link" href="https://gvb-gymnasium.de/" target="_blank">IServ</a>
        <a class="link" href="https://www.gvb-berlin.de/unterricht-plus/arbeitsgemeinschaften/ag-videopodcast/" target="_blank">Website</a>
    </div>
    <div class="board">
        <div class="column" id="todo" ondrop="drop(event, 'todo')" ondragover="allowDrop(event)">
            <h2>To-Do</h2>
            <hr>
            <div class="tasks-in-btn">
                <input type="text" id="taskInput" class="task-input" placeholder="Enter a task..."
                    oninput="capitalizeInput(this)">
                <button class="add-task-btn" onclick="addTask('todo')">
                    Add Task
                </button>
            </div>
            <div class="task-container"></div>
        </div>

        <div class="column" id="in-progress" ondrop="drop(event, 'in-progress')" ondragover="allowDrop(event)">
            <h2>In Progress</h2>
            <hr>
            <div class="task-container"></div>
        </div>
        <div class="column" id="done" ondrop="drop(event, 'done')" ondragover="allowDrop(event)">
            <h2>Done</h2>
            <hr>
            <div class="task-container"></div>
        </div>
    </div>

    /* Login Dialog */
    <dialog id="loginDialog" class="login-dialog">
        <form method="dialog" class="login-box" id="loginForm">
            <h2>Login</h2>

            <label for="password">Passwort</label>

            <div class="password-wrapper">
                <input type="password" id="password" name="password" placeholder="Passwort eingeben" required>
                <button type="button" id="toggleBtn">Anzeigen</button>
            </div>

            <p class="hint" id="status">Bitte gib dein Passwort ein.</p>

            <button type="submit" class="login-btn">Einloggen</button>
        </form>
    </dialog>

    /* Show the login dialog on page load */
    <script src="script.js"></script>
</body>

</html>
